name: Reproduce

# Runs the four analysis scripts with the locked package versions of 2021 and
# uploads the regenerated plots, feature selections and console output.
# TensorFlow 2.4 needs an x86_64 CPU with AVX, which Apple Silicon (also via
# Rosetta) does not provide, so this workflow is the reference run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        location: [Cleveland, Hungarian, Switzerland, Vancouver]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.8"
      - run: uv sync --frozen
      - name: Run ${{ matrix.location }}_Analysis.py
        run: |
          mkdir -p out
          uv run --frozen python ${{ matrix.location }}_Analysis.py 2>&1 | tee out/${{ matrix.location }}_stdout.txt
      - name: Show changed outputs
        run: git status --short
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.location }}
          path: |
            out/
            plots/
            rand_forest_feature_selection(25)/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx ruff check .
      - run: uvx ruff format --check .
