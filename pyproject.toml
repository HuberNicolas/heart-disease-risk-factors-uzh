[project]
name = "heart-disease-risk-factors-uzh"
version = "2.0.0"
description = "Risk factors for heart disease in the four locations of the UCI Heart Disease dataset"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kalvin Dobler" },
    { name = "Nathalie Guttmann" },
    { name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
    "umap-learn>=0.5.7",
]

[project.scripts]
heart-disease = "heart_disease.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heart_disease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecations inside seaborn 0.13, not in this code.
filterwarnings = ["ignore::DeprecationWarning:seaborn", "ignore::PendingDeprecationWarning:seaborn"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses, safe as defaults.
extend-immutable-calls = ["heart_disease.data.FeatureSet", "heart_disease.pipeline.Settings"]
